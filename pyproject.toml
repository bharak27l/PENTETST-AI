[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pentest-ai"
version = "0.2.0"
description = "Safe, modular pentest orchestration and reporting application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.4",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.5.2",
  "reportlab>=4.2.2",
  "python-docx>=1.1.2",
]

[project.optional-dependencies]
test = ["pytest>=8.3.0", "httpx>=0.27.0"]

[project.scripts]
pentest-ai = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]
