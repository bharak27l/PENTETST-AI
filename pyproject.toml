[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pentest-ai"
version = "0.1.0"
description = "Safe, modular pentest orchestration and reporting application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.4",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.5.2",
]

[project.scripts]
pentest-ai = "app.cli:main"

[tool.setuptools]
packages = ["app", "app.api", "app.core", "app.modules", "app.modules.recon", "app.modules.scanner", "app.modules.reporting", "app.modules.exploit", "app.modules.screenshot"]
