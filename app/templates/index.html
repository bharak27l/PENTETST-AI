<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>{{ title }}</h1>
        <p>Authorized target validation, safe security checks, and reporting.</p>
      </header>

      <section class="card">
        <form id="scan-form">
          <label for="target">Target URL</label>
          <input id="target" name="target" type="text" placeholder="https://example.com" required />
          <button type="submit">Run scan</button>
        </form>
      </section>

      <section id="results" class="card hidden">
        <h2>Scan report</h2>
        <div id="report"></div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
